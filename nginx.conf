
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
        listen       80;
        server_name  aiplatform.make.huawei.com;

        # 【核心修复】解除 Nginx 默认 1MB 的上传限制，解决上传文件 413 和 Unexpected token '<' 报错
        client_max_body_size 200M; 

        # 1. 默认访问 3001 端口的门户/入口页面
        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ================= 门户网站 (AOIAI) 的后端接口 =================
        location /api/login {
            proxy_pass http://127.0.0.1:3002/api/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/users {
            proxy_pass http://127.0.0.1:3002/api/users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 【核心修复】解决同名接口冲突问题。
        # 门户(3002)和AI对话平台(3000)都会请求 /api/models，这里通过判断请求来源智能分发
        location /api/models {
            # 默认发给门户网站的后端 (3002端口)
            set $api_target http://127.0.0.1:3002;
            
            # 如果发现是从 AI 对话网页 (/chat/) 发出的请求，就切回发给 3000 端口
            if ($http_referer ~* "/chat/") {
                set $api_target http://127.0.0.1:3000;
            }
            
            proxy_pass $api_target$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 补充：代理门户网站可能会直接读取的静态资源目录
        location /models/ {
            proxy_pass http://127.0.0.1:3002/models/;
        }
        location /images/ {
            proxy_pass http://127.0.0.1:3002/images/;
        }
        # ============================================================

        # 2. AI 平台主界面 (3000 端口)
        # 注意：proxy_pass 末尾的斜杠表示在转发时去掉 /chat 部分
        location /chat/ {
            # 注意：这里最后绝对不能有斜杠！保留 /chat/ 路径转发给 Vite
            proxy_pass http://127.0.0.1:3000; 
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # 3. AI 平台的后端接口 (负责拦截剩下的 /api/chat, /api/upload 等)
        location /api/ {
            proxy_pass http://127.0.0.1:3000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            
            # 【核心修复】关闭上传时的请求缓冲，防止上传大附件时被 Nginx 截断
            proxy_request_buffering off;
            
            # 针对 AI 聊天流式接口的特殊配置
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # 4. 静态文件上传预览
        location /uploads/ {
            proxy_pass http://127.0.0.1:3000/uploads/;
        }
    }


